<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Telegram formulár</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h3>Formulár</h3>

  <label>Combo 1</label><br>
  <select id="combo1">
    <option value="A">A</option>
    <option value="B">B</option>
  </select>

  <br><br>

  <label>Combo 2</label><br>
  <select id="combo2">
    <option value="X">X</option>
    <option value="Y">Y</option>
  </select>

  <br><br>

  <label>Dátum/čas od</label><br>
  <input type="datetime-local" id="dt1">

  <br><br>

  <label>Dátum/čas do</label><br>
  <input type="datetime-local" id="dt2">

  <br><br>

  <button onclick="odoslat()">Odoslať</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    function odoslat() {
      const data = {
        combo1: document.getElementById("combo1").value,
        combo2: document.getElementById("combo2").value,
        dateTime1: document.getElementById("dt1").value,
        dateTime2: document.getElementById("dt2").value,
        sentAt: new Date().toISOString()
      };

      tg.sendData(JSON.stringify(data));
      tg.close();
    }
  </script>
</body>
</html>
