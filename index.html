<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Zatvorenia</title>
    <!-- Použijeme oficiálne nemodifikované SDK zo serverov Telegramu -->
    <script src="https://telegram.org"></script>
</head>
<body style="background: #ffffff; padding: 30px; text-align: center; font-family: sans-serif;">

    <h2>Testovacia aplikácia</h2>
    <p>Skúšame iba čisté natívne zatvorenie okna.</p>
    
    <button id="closeBtn" style="padding: 20px 40px; font-size: 20px; background: #ff3b30; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%;">
        ❌ ZAVRIEŤ OKNO
    </button>
    <script>
        // Inicializácia Telegram prostredia
        const tg = window.Telegram.WebApp;
        
        // Oficiálny štart aplikácie
        tg.ready();
        tg.expand();

        // Ak používateľ klikne na tlačidlo, natívne povieme Telegramu, aby WebView zatvoril
        document.getElementById('closeBtn').addEventListener('click', () => {
            tg.close();
        });
    </script>
</body>
</html>
